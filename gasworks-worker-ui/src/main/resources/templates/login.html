<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>作業員ログイン - Gasworks</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="mb-4">作業員ログイン</h2>
            <form th:action="@{/login}" method="post">
                <div class="mb-3"><input type="email" name="username" class="form-control" placeholder="メールアドレス"></div>
                <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="パスワード"></div>
                <button type="submit" class="btn btn-primary w-100">ログイン</button>
            </form>
        </div>
    </div>
</body>
</html>
