<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>作業員ログイン - Gasworks Prototype</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5 bg-light">
    <div class="row justify-content-center">
        <div class="col-md-4 card shadow-lg p-4 mt-5 border-0">
            <h2 class="mb-4 text-center fw-bold">
                <svg xmlns="http://www.w3.org/2003/svg" width="32" height="32" fill="currentColor" class="bi bi-fire text-primary me-2" viewBox="0 0 16 16" style="vertical-align: text-bottom;"><path d="M8 16c3.314 0 6-2 6-5.5 0-1.5-.5-4-2.5-6 .25 1.5-1.25 2-1.25 2C11 4 9 .5 6 0c.357 2 .5 4-2 6-1.25 1-2 2.729-2 4.5C2 14 4.686 16 8 16m0-1c-1.657 0-3-1-3-2.75 0-.75.25-2 1.25-3C6.125 10 7 10.5 7 10.5c-.375-1.25.5-3.25 2-3.5-.179 1-.25 2 1 3 .625.5 1 1.364 1 2.25C11 14 9.657 15 8 15"/></svg>
                Gasworks
            </h2>
            <h6 class="mb-4 text-secondary text-center">作業員システム ログイン</h6>
            <form th:action="@{/menu}">
                <div class="mb-3"><input type="email" class="form-control form-control-lg" placeholder="メールアドレス" required></div>
                <div class="mb-3"><input type="password" class="form-control form-control-lg" placeholder="パスワード" required></div>
                <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">ログイン</button>
            </form>
        </div>
    </div>
</body>
</html>
