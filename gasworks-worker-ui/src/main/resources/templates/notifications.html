<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>お知らせ - Gasworks Prototype</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <svg xmlns="http://www.w3.org/2003/svg" width="24" height="24" fill="currentColor" class="bi bi-fire text-white me-2" viewBox="0 0 16 16" style="vertical-align: text-bottom;"><path d="M8 16c3.314 0 6-2 6-5.5 0-1.5-.5-4-2.5-6 .25 1.5-1.25 2-1.25 2C11 4 9 .5 6 0c.357 2 .5 4-2 6-1.25 1-2 2.729-2 4.5C2 14 4.686 16 8 16m0-1c-1.657 0-3-1-3-2.75 0-.75.25-2 1.25-3C6.125 10 7 10.5 7 10.5c-.375-1.25.5-3.25 2-3.5-.179 1-.25 2 1 3 .625.5 1 1.364 1 2.25C11 14 9.657 15 8 15"/></svg>Gasworks
            </a>
        </div>
    </nav>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>本部からのお知らせ</h3>
            <a th:href="@{/menu}" class="btn btn-outline-secondary text-end">戻る</a>
        </div>
        <div class="list-group shadow-sm">

            <div th:each="notification : ${notifications}"
                 class="list-group-item list-group-item-action py-3"
                 style="cursor: pointer;"
                 data-bs-toggle="collapse"
                 th:data-bs-target="'#collapse-' + ${notification.id}"
                 aria-expanded="false">

                <!-- 日付 -->
                <div class="d-flex w-100 justify-content-between">

                    <h5 th:class="${notification.category != null and notification.category.name() == 'ALERT'} ? 'mb-1 text-danger' : 'mb-1'"
                        th:text="${notification.title}">
                        タイトル
                    </h5>

                    <small th:text="${notification.relativePublishedAt}">
                        投稿日
                    </small>

                </div>

                <!-- 概要 -->
                <p class="mb-1 text-muted"
                   th:text="${notification.summary}">
                    概要
                </p>

                <!-- 通知種別 -->
                <small th:if="${notification.category != null and notification.category.name() == 'ALERT'}" class="badge bg-danger">重要</small>
                <small th:if="${notification.category != null and notification.category.name() == 'INFO'}" class="badge bg-info text-dark">通知</small>
                <small th:if="${notification.category != null and notification.category.name() == 'OFFICE'}" class="badge bg-secondary">事務</small>

                <!-- 本文 (Collapse) -->
                <div class="collapse mt-3" th:id="'collapse-' + ${notification.id}">
                    <div class="p-3 bg-light rounded border text-dark" th:text="${notification.content}" style="white-space: pre-wrap;">
                        本文がここに入ります。
                    </div>
                </div>

            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
