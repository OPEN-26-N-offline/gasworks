<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>巡回ルート画面 - Gasworks Prototype</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

    <style>
        .custom-div-icon {
            background: #00d4ff;
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-start {
            background-color: #0d6efd !important;
        }

        .bg-end {
            background-color: #dc3545 !important;
        }

        .leaflet-routing-container {
            display: none;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/menu}">
            Gasworks
        </a>
    </div>
</nav>

<div class="container text-center mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4 text-start">
        <h3>
            本日の巡回ルート
            <span id="current-datetime" class="fs-6 text-muted fw-normal ms-3"></span>
        </h3>
        <a th:href="@{/menu}" class="btn btn-outline-secondary text-end">戻る</a>
    </div>

    <div class="card shadow-sm overflow-hidden">
        <div id="map" style="height: 400px; width: 100%;"></div>

        <div class="card-footer bg-white text-start">
            <div class="row text-center py-2">
                <div class="col-4 border-end">
                    <small class="text-muted">残り件数</small><br>
                    <span class="fw-bold fs-5"
                          th:text="${routeInfo.remainingCount} + '件'">4件</span>
                </div>

                <div class="col-4 border-end">
                    <small class="text-muted">予定時間</small><br>
                    <span class="fw-bold fs-5"
                          th:text="${routeInfo.estimatedMinutes} + '分'">120分</span>
                </div>

                <div class="col-4 text-primary font-weight-bold">
                    <small class="text-muted">最短ルート</small><br>
                    <span class="fw-bold fs-5"
                          th:text="${routeInfo.routeStatus}">計算済</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {

        const now = new Date();

        const dateStr = now.getFullYear() + '/' +
            String(now.getMonth() + 1).padStart(2, '0') + '/' +
            String(now.getDate()).padStart(2, '0');

        const timeStr = String(now.getHours()).padStart(2, '0') + ':' +
            String(now.getMinutes()).padStart(2, '0');

        document.getElementById('current-datetime').textContent = dateStr + ' ' + timeStr;

        const routePoints = /*[[${routePoints}]]*/ [];

        if (routePoints.length === 0) {
            alert('巡回ルート情報がありません。');
            return;
        }

        const start = [
            routePoints[0].latitude,
            routePoints[0].longitude
        ];

        const waypoints = routePoints.map(point =>
            L.latLng(point.latitude, point.longitude)
        );

        const map = L.map('map').setView(start, 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        L.Routing.control({
            waypoints: waypoints,

            router: L.Routing.osrmv1({
                serviceUrl: 'https://router.project-osrm.org/route/v1'
            }),

            lineOptions: {
                styles: [
                    {
                        color: '#00d4ff',
                        opacity: 0.8,
                        weight: 6
                    }
                ]
            },

            createMarker: function(i, wp, n) {
                const point = routePoints[i];

                let label = '';
                let className = '';

                if (point.type === 'START') {
                    label = 'START';
                    className = 'bg-start';
                } else if (point.type === 'END') {
                    label = 'END';
                    className = 'bg-end';
                } else {
                    label = point.sequence.toString();
                }

                const isMain = label === 'START' || label === 'END';
                const size = isMain ? 44 : 28;

                return L.marker(wp.latLng, {
                    icon: L.divIcon({
                        className: `custom-div-icon ${className}`,
                        html: `<span style="font-size:${isMain ? '10px' : '14px'}">${label}</span>`,
                        iconSize: [size, size],
                        iconAnchor: [size / 2, size / 2]
                    })
                });
            },

            addWaypoints: false,
            routeWhileDragging: false,
            draggableWaypoints: false,
            fitSelectedRoutes: true,
            show: false
        }).addTo(map);
    });
</script>
</body>
</html>
