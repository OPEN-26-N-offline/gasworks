<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ポータル - Gasworks Prototype</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .card { transition: transform 0.2s; cursor: pointer; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <svg xmlns="http://www.w3.org/2003/svg" width="24" height="24" fill="currentColor" class="bi bi-fire text-white me-2" viewBox="0 0 16 16" style="vertical-align: text-bottom;"><path d="M8 16c3.314 0 6-2 6-5.5 0-1.5-.5-4-2.5-6 .25 1.5-1.25 2-1.25 2C11 4 9 .5 6 0c.357 2 .5 4-2 6-1.25 1-2 2.729-2 4.5C2 14 4.686 16 8 16m0-1c-1.657 0-3-1-3-2.75 0-.75.25-2 1.25-3C6.125 10 7 10.5 7 10.5c-.375-1.25.5-3.25 2-3.5-.179 1-.25 2 1 3 .625.5 1 1.364 1 2.25C11 14 9.657 15 8 15"/></svg>Gasworks Field Portal
            </a>
            <a th:href="@{/login}" class="btn btn-outline-light btn-sm">ログアウト</a>
        </div>
    </nav>
    <div class="container">
        <h2 class="mb-4">業務メニュー</h2>
        <div class="row g-4">
            <!-- 1. 担当顧客一覧 -->
            <div class="col-6 col-md-4">
                <div class="card h-100 border-primary shadow-sm text-center">
                    <div class="card-body py-4">
                        <h5 class="card-title text-primary">担当顧客一覧</h5>
                        <p class="card-text small text-muted">本日の検針対象を確認</p>
                        <a th:href="@{/customer}" class="btn btn-primary stretched-link">開く</a>
                    </div>
                </div>
            </div>
            <!-- 2. ルートマップ -->
            <div class="col-6 col-md-4">
                <div class="card h-100 shadow-sm text-center">
                    <div class="card-body py-4">
                        <h5 class="card-title">ルートマップ</h5>
                        <p class="card-text small text-muted">効率的な巡回経路を表示</p>
                        <a th:href="@{/map}" class="btn btn-outline-primary stretched-link">表示</a>
                    </div>
                </div>
            </div>
            <!-- 3. お知らせ -->
            <div class="col-6 col-md-4">
                <div class="card h-100 shadow-sm text-center">
                    <div class="card-body py-4">
                        <h5 class="card-title">お知らせ</h5>
                        <p class="card-text small text-muted">本部からの指示事項</p>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">2</span>
                        <a th:href="@{/notice}" class="btn btn-outline-primary stretched-link">確認</a>
                    </div>
                </div>
            </div>
            <!-- 4. 同期・送信 -->
            <div class="col-6 col-md-4">
                <div class="card h-100 shadow-sm text-center">
                    <div class="card-body py-4">
                        <h5 class="card-title text-success">日報作成・同期</h5>
                        <p class="card-text small text-muted">本日の作業報告を送信</p>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success">提出済</span>
                        <a th:href="@{/sync}" class="btn btn-outline-success stretched-link">実行</a>
                    </div>
                </div>
            </div>
            <!-- 5. 緊急連絡 -->
            <div class="col-6 col-md-4">
                <div class="card h-100 border-danger shadow-sm text-center">
                    <div class="card-body py-4">
                        <h5 class="card-title text-danger">緊急連絡</h5>
                        <p class="card-text small text-muted">事故・トラブル報告</p>
                        <a th:href="@{/emergency}" class="btn btn-danger stretched-link">通報</a>
                    </div>
                </div>
            </div>
            <!-- 6. 設定・個人 -->
            <div class="col-6 col-md-4">
                <div class="card h-100 shadow-sm text-center">
                    <div class="card-body py-4">
                        <h5 class="card-title text-secondary">個人設定</h5>
                        <p class="card-text small text-muted">アプリ設定・ログ</p>
                        <a th:href="@{/settings}" class="btn btn-outline-secondary stretched-link">設定</a>
                    </div>
                </div>
            </div>
        </div>
<div class="d-flex flex-column d-md-flex flex-md-row align-items-center justify-content-center mt-3 mb-4 text-center">
    <div class="h5 h4-md fw-normal text-dark mx-3 mx-md-4 mb-2 mb-md-0">
        安全なガスインフラの供給を通じて、
    </div>
    
    <img th:src="@{\images\gasworks_footer.png}" alt="Footer Logo" class="img-fluid my-2 my-md-0" style="width: 60%; max-width: 250px; height: auto;">
    
    <div class="h5 h4-md fw-normal text-dark mx-3 mx-md-4 mb-0">
        豊かで持続可能な未来を支える。
    </div>
</div>
        <div class="text-center text-muted small pb-4">
            Licensed by GasWorks Operations Group. © 2026 All Rights Reserved.
        </div>
    </div>
</body>
</html>
