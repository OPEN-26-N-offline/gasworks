<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">GAS WORKS</title>
    <!-- Bootstrap CSS -->
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #003366;
            --accent-color: #e60012;
        }
        body { padding-top: 4.5rem; font-family: "BIZ UDPGothic", "Meiryo", sans-serif; }
        .navbar-brand { font-weight: bold; letter-spacing: 0.1rem; }
    </style>
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">GAS WORKS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" th:href="@{/}">ホーム</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">担当顧客一覧</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">マイページ</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm">ログアウト</a>
                </div>
            </div>
        </div>
    </nav>

    <div th:fragment="scripts">
        <!-- Bootstrap JS -->
        <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    </div>
</body>
</html>
