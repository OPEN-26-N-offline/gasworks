<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flameGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4cc9f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="10" y="10" width="180" height="180" rx="20" fill="#f8f9fa" stroke="#003366" stroke-width="2"/>

  <g transform="translate(100, 160)">
    <!-- Triple Flame Design (Bottom-aligned) -->
    <!-- Large Center Flame -->
    <path d="M0 -110 C25 -110 45 -80 45 -50 C45 -10 25 0 0 0 C-25 0 -45 -10 -45 -50 C-45 -80 -25 -110 0 -110 Z" fill="url(#flameGradient)" opacity="0.9"/>

    <!-- Medium Left Flame -->
    <path d="M-40 -80 C-20 -80 -5 -60 -5 -40 C-5 -10 -20 0 -40 0 C-60 0 -75 -10 -75 -40 C-75 -60 -60 -80 -40 -80 Z" fill="#003366" opacity="0.7"/>

    <!-- Medium Right Flame -->
    <path d="M40 -80 C60 -80 75 -60 75 -40 C75 -10 60 0 40 0 C20 0 5 -10 5 -40 C5 -60 20 -80 40 -80 Z" fill="#003366" opacity="0.7"/>
  </g>
</svg>
