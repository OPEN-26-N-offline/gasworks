<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>検針入力 - Gasworks Prototype</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <svg xmlns="http://www.w3.org/2003/svg" width="24" height="24" fill="currentColor" class="bi bi-fire text-primary me-2" viewBox="0 0 16 16" style="vertical-align: text-bottom;"><path d="M8 16c3.314 0 6-2 6-5.5 0-1.5-.5-4-2.5-6 .25 1.5-1.25 2-1.25 2C11 4 9 .5 6 0c.357 2 .5 4-2 6-1.25 1-2 2.729-2 4.5C2 14 4.686 16 8 16m0-1c-1.657 0-3-1-3-2.75 0-.75.25-2 1.25-3C6.125 10 7 10.5 7 10.5c-.375-1.25.5-3.25 2-3.5-.179 1-.25 2 1 3 .625.5 1 1.364 1 2.25C11 14 9.657 15 8 15"/></svg>Gasworks
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>検針入力</h3>
            <a href="customer_list.html" class="btn btn-outline-secondary">戻る</a>
        </div>

        <!-- 顧客情報サマリー -->
        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body bg-white rounded">
                <h5 class="card-title mb-1">田中 太郎 様</h5>
                <p class="card-text text-muted mb-0 small">東京都渋谷区桜丘町1-1</p>
                <p class="card-text text-muted small">メーター型式: N型 / 前回値: 125.4 m³</p>
            </div>
        </div>

        <form action="customer_list.html" method="get">
            <!-- 基本検針項目 (必須想定) -->
            <div class="card mb-4 shadow-sm border-primary">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">基本検針・安全確認項目</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">用途種別</label>
                            <select class="form-select border-primary" required>
                                <option value="general" selected>一般家庭用 (低圧)</option>
                                <option value="commercial">業務用・ビル用 (中圧/低圧)</option>
                                <option value="industrial">工業用</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">供給状態</label>
                            <select class="form-select border-primary">
                                <option value="open" selected>開栓中 (通常)</option>
                                <option value="closed">閉栓中</option>
                                <option value="suspended">一時差押・停止</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">今回指針値 (m³)</label>
                            <input type="number" step="0.1" class="form-control form-control-lg border-primary" placeholder="000.0" required>
                            <div class="form-text">前回値(125.4 m³)との差分から、異常な使用量がないか自動チェックされます。</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">保安警告表示 (マイコンコード)</label>
                            <input type="text" class="form-control" placeholder="例: なし、AC、E1等">
                            <div class="form-text">メーターに表示されているアルファベットコード</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">供給圧力確認</label>
                            <div class="input-group">
                                <input type="number" step="0.01" class="form-control" placeholder="0.00">
                                <span class="input-group-text">kPa</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 詳細検針項目 (任意) -->
            <div class="card mb-4 shadow-sm">
                <div class="card-header bg-light d-flex justify-content-between align-items-center" data-bs-toggle="collapse" data-bs-target="#detailedSection" style="cursor: pointer;">
                    <h5 class="mb-0 text-secondary">詳細検針項目 (任意)</h5>
                    <span class="btn btn-sm btn-outline-secondary">表示 / 非表示</span>
                </div>
                <div id="detailedSection" class="collapse">
                    <div class="card-body">
                        <div class="mb-4">
                            <label class="form-label fw-bold">設備状態チェック</label>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="check1">
                                <label class="form-check-label" for="check1">メーター周辺の漏洩なし</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="check2">
                                <label class="form-check-label" for="check2">腐食・損傷なし</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="check3">
                                <label class="form-check-label" for="check3">火災警報器の有効期限内</label>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">現場メモ</label>
                            <textarea class="form-control" rows="3" placeholder="異常や特記事項があれば入力してください"></textarea>
                        </div>
                        <div class="mb-2">
                            <label class="form-label fw-bold">写真添付</label>
                            <input type="file" class="form-control" id="photoInput" accept="image/*">
                            <div class="mt-3 text-center">
                                <img id="photoPreview" src="" alt="プレビュー" class="img-fluid rounded shadow-sm d-none" style="max-height: 200px;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2 mb-5">
                <button type="submit" class="btn btn-primary btn-lg shadow-sm">検針結果を保存</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap Bundle with Popper (Collapse動作に必要) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'edit') {
                // タイトルの文言を変更
                const titleElement = document.querySelector('h3');
                if (titleElement) {
                    titleElement.innerText = '検針修正';
                    // 修正モードであることを示すバッジを追加
                    const badge = document.createElement('span');
                    badge.className = 'badge bg-warning text-dark ms-2 fs-6 fw-normal';
                    badge.innerText = '修正モード';
                    titleElement.appendChild(badge);
                }
                // 保存ボタンのテキストを「更新」に変更
                const submitBtn = document.querySelector('button[type="submit"]');
                if (submitBtn) submitBtn.innerText = '検針結果を更新';
            }

            // 写真プレビュー機能
            const photoInput = document.getElementById('photoInput');
            const photoPreview = document.getElementById('photoPreview');

            if (photoInput && photoPreview) {
                photoInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            photoPreview.src = e.target.result;
                            photoPreview.classList.remove('d-none');
                        }
                        reader.readAsDataURL(file);
                    }
                });
            }
        });
    </script>
</body>
</html>
