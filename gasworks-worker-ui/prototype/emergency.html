<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>緊急連絡 - Gasworks Prototype</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-danger mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <svg xmlns="http://www.w3.org/2003/svg" width="24" height="24" fill="currentColor" class="bi bi-fire text-white me-2" viewBox="0 0 16 16" style="vertical-align: text-bottom;"><path d="M8 16c3.314 0 6-2 6-5.5 0-1.5-.5-4-2.5-6 .25 1.5-1.25 2-1.25 2C11 4 9 .5 6 0c.357 2 .5 4-2 6-1.25 1-2 2.729-2 4.5C2 14 4.686 16 8 16m0-1c-1.657 0-3-1-3-2.75 0-.75.25-2 1.25-3C6.125 10 7 10.5 7 10.5c-.375-1.25.5-3.25 2-3.5-.179 1-.25 2 1 3 .625.5 1 1.364 1 2.25C11 14 9.657 15 8 15"/></svg>Gasworks
            </a>
        </div>
    </nav>
    <div class="container">
        <div class="alert alert-danger mb-4">
            <h5 class="alert-heading">重大なトラブルが発生した場合</h5>
            <p class="mb-0 small">ガス漏れ、交通事故、負傷など、緊急を要する場合は直ちに以下の連絡先へ通報してください。</p>
        </div>
        <div class="d-grid gap-3 mb-4">
            <a href="tel:0000000000" class="btn btn-danger btn-lg py-3 shadow">
                <span class="fs-4">🚨 センター緊急通報</span><br>
                <small>(24時間対応直通ダイヤル)</small>
            </a>
        </div>
        <div class="card shadow-sm mb-4">
            <div class="card-header fw-bold">緊急連絡先リスト</div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    渋谷北支社（担当部署）
                    <a href="tel:0312345678" class="btn btn-sm btn-outline-primary">発信</a>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    警察 (110番)
                    <a href="tel:110" class="btn btn-sm btn-outline-dark">発信</a>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    消防・救急 (119番)
                    <a href="tel:119" class="btn btn-sm btn-outline-dark">発信</a>
                </li>
            </ul>
        </div>
        <a href="index.html" class="btn btn-secondary w-100">メニューに戻る</a>
    </div>
</body>
</html>
