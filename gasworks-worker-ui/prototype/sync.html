<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>データ同期 - Gasworks Prototype</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <svg xmlns="http://www.w3.org/2003/svg" width="24" height="24" fill="currentColor" class="bi bi-fire text-white me-2" viewBox="0 0 16 16" style="vertical-align: text-bottom;"><path d="M8 16c3.314 0 6-2 6-5.5 0-1.5-.5-4-2.5-6 .25 1.5-1.25 2-1.25 2C11 4 9 .5 6 0c.357 2 .5 4-2 6-1.25 1-2 2.729-2 4.5C2 14 4.686 16 8 16m0-1c-1.657 0-3-1-3-2.75 0-.75.25-2 1.25-3C6.125 10 7 10.5 7 10.5c-.375-1.25.5-3.25 2-3.5-.179 1-.25 2 1 3 .625.5 1 1.364 1 2.25C11 14 9.657 15 8 15"/></svg>Gasworks
            </a>
        </div>
    </nav>
    <div class="container">
        <div class="card shadow-sm mt-5">
            <div class="card-body text-center py-5" id="sync-container">
                <h4 class="mb-4" id="sync-status">日報作成・送信</h4>
                <div class="progress mb-4" style="height: 30px;">
                    <div id="sync-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                </div>
                <p id="sync-message" class="text-muted">本日の作業データ（12件）を送信して日報を作成します。</p>
                <div class="mt-4">
                    <button id="start-sync-btn" class="btn btn-primary btn-lg px-5 shadow-sm">日報を提出する</button>
                    <button id="cancel-sync-btn" class="btn btn-outline-danger d-none">キャンセル</button>
                </div>
            </div>
            <div class="card-footer bg-white border-top-0 pb-4 px-4 text-center">
                <div class="alert alert-warning d-inline-block small mb-0">
                    同期中はアプリを閉じないでください。
                </div>
            </div>
        </div>
        <div class="mt-4 text-center">
            <a href="index.html" class="btn btn-secondary">メニューに戻る</a>
        </div>
    </div>

    <script>
        document.getElementById('start-sync-btn').addEventListener('click', function() {
            const startBtn = this;
            const cancelBtn = document.getElementById('cancel-sync-btn');
            const progressBar = document.getElementById('sync-progress-bar');
            const statusText = document.getElementById('sync-status');
            const messageText = document.getElementById('sync-message');
            
            // UIの状態変更
            startBtn.classList.add('d-none');
            cancelBtn.classList.remove('d-none');
            statusText.textContent = '日報提出中...';
            messageText.textContent = '作業報告と検針データを本部へ送信しています。';
            
            let width = 0;
            const interval = setInterval(function() {
                if (width >= 100) {
                    clearInterval(interval);
                    // 完了時の演出
                    statusText.textContent = '提出完了';
                    statusText.classList.add('text-success');
                    messageText.innerHTML = '本日の業務報告が完了しました。お疲れ様でした！<br>送信済データ: 12件';
                    cancelBtn.classList.add('d-none');
                    
                    // メニューに戻るボタンを強調するためのクラス追加など
                    const backBtn = document.querySelector('.btn-secondary');
                    backBtn.classList.remove('btn-secondary');
                    backBtn.classList.add('btn-primary', 'px-5');
                } else {
                    // ランダムに進行速度を変えることでリアル感を出す
                    width += Math.random() * 15;
                    if (width > 100) width = 100;
                    
                    progressBar.style.width = width + '%';
                    progressBar.setAttribute('aria-valuenow', Math.floor(width));
                    progressBar.textContent = Math.floor(width) + '%';
                }
            }, 300);
        });
    </script>
</body>
</html>
